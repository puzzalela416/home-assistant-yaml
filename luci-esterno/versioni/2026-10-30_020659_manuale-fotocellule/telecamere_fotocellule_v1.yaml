    controllo all’allarme. Nessun comando ai faretti. Il programma notturno ha precedenza sulle sole luci selezionate; la
    fotocellula non le spegne. Spegnimento manuale prioritario fino alla fascia di 30 minuti successiva.
  mode: queued
  max: 100
  triggers:
  - trigger: state
    entity_id: binary_sensor.piscina_orto_movimento
    from: 'off'
    to: 'on'
