          ''button.piazzale_ptz_sinistra'', ''destra'': ''button.piazzale_ptz_destra''}[direzione] }}'
    - condition: template
      value_template: '{{ states[pulsante_ptz] is not none and states(pulsante_ptz) != ''unavailable'' and states(''camera.piazzale_lente_scorrevole_0'')
        not in [''unknown'',''unavailable''] }}'
