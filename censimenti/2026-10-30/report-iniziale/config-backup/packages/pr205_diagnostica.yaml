
# PR205 — Diagnostica acque; sola lettura, NON comanda il PLC.
# Da salvare in /config/packages/pr205_diagnostica.yaml
# Richiede: sensori Modbus già presenti, stati Q1-Q4 e dab_flusso_attivo.
# Il sensore PR205 Blocco filtri (=1) segnala acqua negli scarichi.
# Un ciclo resta aperto per almeno un'ora dalla prima attivazione; le pause fra gli stadi NON lo resettano.

input_boolean:
  pr205_diag_ciclo_attivo:
    name: PR205 DIAG Ciclo controlavaggio attivo

input_datetime:
  pr205_diag_inizio_lavaggio:
    name: PR205 DIAG Inizio controlavaggio
    has_date: true
    has_time: true
  pr205_diag_ultimo_filtro2:
    name: PR205 DIAG Ultimo filtro 2
    has_date: true
    has_time: true
  pr205_diag_ultimo_filtro3:
    name: PR205 DIAG Ultimo filtro 3
    has_date: true
    has_time: true
  pr205_diag_ultimo_filtro4:
    name: PR205 DIAG Ultimo filtro 4 presunto
    has_date: true
    has_time: true
  pr205_diag_ultima_chiusura_q2:
    name: PR205 DIAG Ultima chiusura Q2 con Q3 attivo
    has_date: true
    has_time: true

input_select:
  pr205_diag_filtro_in_ciclo:
    name: PR205 DIAG Filtro in controlavaggio
    options:
      - Nessuno
      - Filtro 2 programmato
      - Filtro 3 programmato
      - Filtro 4 presunto

input_number:
  pr205_diag_durata_ultimo_lavaggio:
    name: PR205 DIAG Durata ultimo controlavaggio
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: min

# Campionamento almeno una volta al minuto, anche quando i livelli restano uguali.
# E' necessario per non trarre conclusioni da due letture isolate.
template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: PR205 DIAG Campione pozzo
        unique_id: pr205_diag_campione_pozzo_20261025
        unit_of_measurement: cm
        availability: "{{ is_number(states('sensor.livello_pozzo_plc')) }}"
        state: "{{ states('sensor.livello_pozzo_plc') | float(0) }}"
        attributes:
          campionato_il: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - name: PR205 DIAG Campione potabile
        unique_id: pr205_diag_campione_potabile_20261025
        unit_of_measurement: cm
        availability: "{{ is_number(states('sensor.livello_potabile_plc')) }}"
        state: "{{ states('sensor.livello_potabile_plc') | float(0) }}"
        attributes:
          campionato_il: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"


  - binary_sensor:
      - name: PR205 DIAG Scarico oltre un ora
        unique_id: pr205_diag_scarico_oltre_ora_20261025
        availability: >-
          {{ states('sensor.pr205_blocco_filtri') in ['0', '1'] }}
        state: >-
          {% set inizio = as_timestamp(states('input_datetime.pr205_diag_inizio_lavaggio'), 0) %}
          {{ is_state('input_boolean.pr205_diag_ciclo_attivo', 'on')
             and is_state('sensor.pr205_blocco_filtri', '1')
             and inizio > 0 and (as_timestamp(now()) - inizio) >= 3600 }}

      - name: PR205 DIAG Filtro 2 non partito
        unique_id: pr205_diag_filtro2_non_partito_20261025
        availability: "{{ states('sensor.pr205_blocco_filtri') in ['0', '1'] }}"
        state: >-
          {{ now().weekday() in [0, 3]
             and (now().hour * 60 + now().minute) >= 640
             and as_timestamp(states('input_datetime.pr205_diag_ultimo_filtro2'), 0)
                 < as_timestamp(today_at('00:00')) }}

      - name: PR205 DIAG Filtro 3 non partito
        unique_id: pr205_diag_filtro3_non_partito_20261025
        availability: "{{ states('sensor.pr205_blocco_filtri') in ['0', '1'] }}"
        state: >-
          {{ now().weekday() in [1, 5]
             and (now().hour * 60 + now().minute) >= 880
             and as_timestamp(states('input_datetime.pr205_diag_ultimo_filtro3'), 0)
                 < as_timestamp(today_at('00:00')) }}

      - name: PR205 DIAG Q2 senza ricircolo Q3
        unique_id: pr205_diag_q2_senza_q3_20261025
        availability: >-
          {{ states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('binary_sensor.q3_ricircolo') in ['on','off'] and
             states('switch.plc_ha_manuale') in ['on','off'] }}
        state: >-
          {{ is_state('binary_sensor.q2_pozzo','on') and
             is_state('binary_sensor.q3_ricircolo','off') and
             is_state('switch.plc_ha_manuale','off') }}
        delay_on: "00:01:00"

      - name: PR205 DIAG Q2 senza cloratore Q4
        unique_id: pr205_diag_q2_senza_q4_20261025
        availability: >-
          {{ states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('binary_sensor.q4_cloratore') in ['on','off'] and
             states('switch.plc_ha_manuale') in ['on','off'] }}
        state: >-
          {{ is_state('binary_sensor.q2_pozzo','on') and
             is_state('binary_sensor.q4_cloratore','off') and
             is_state('switch.plc_ha_manuale','off') }}
        delay_on: "00:01:00"

      - name: PR205 DIAG Cloratore Q4 senza Q2
        unique_id: pr205_diag_q4_senza_q2_20261025
        availability: >-
          {{ states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('binary_sensor.q4_cloratore') in ['on','off'] and
             states('switch.plc_ha_manuale') in ['on','off'] }}
        state: >-
          {{ is_state('binary_sensor.q2_pozzo','off') and
             is_state('binary_sensor.q4_cloratore','on') and
             is_state('switch.plc_ha_manuale','off') }}
        delay_on: "00:01:00"

      - name: PR205 DIAG Ricircolo non mantenuto
        unique_id: pr205_diag_ricircolo_non_mantenuto_20261025
        availability: >-
          {{ states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('binary_sensor.q3_ricircolo') in ['on','off'] and
             states('switch.plc_ha_manuale') in ['on','off'] }}
        state: >-
          {% set t = as_timestamp(states('input_datetime.pr205_diag_ultima_chiusura_q2'), 0) %}
          {% set d = as_timestamp(now()) - t %}
          {{ t > 0 and d >= 0 and d < 14400
             and 11 <= now().hour < 17
             and is_state('switch.plc_ha_manuale','off')
             and is_state('binary_sensor.q2_pozzo','off')
             and is_state('binary_sensor.q3_ricircolo','off') }}
        delay_on: "00:01:00"

      - name: PR205 DIAG Pozzo non sale con Q2
        unique_id: pr205_diag_pozzo_non_sale_20261025
        availability: >-
          {{ is_number(states('sensor.pr205_diag_variazione_pozzo_10min')) and
             states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('binary_sensor.q1_potabile') in ['on','off'] and
             states('sensor.pr205_blocco_filtri') in ['0','1'] }}
        state: >-
          {{ is_state('binary_sensor.q2_pozzo','on')
             and is_state('binary_sensor.q1_potabile','off')
             and is_state('input_boolean.pr205_diag_ciclo_attivo','off')
             and is_state('sensor.pr205_blocco_filtri','0')
             and states('sensor.pr205_diag_variazione_pozzo_10min') | float(999) < 2 }}
        delay_on: "00:15:00"

      - name: PR205 DIAG Potabile non sale con Q1
        unique_id: pr205_diag_potabile_non_sale_20261025
        availability: >-
          {{ is_number(states('sensor.pr205_diag_variazione_potabile_10min')) and
             states('binary_sensor.q1_potabile') in ['on','off'] and
             states('binary_sensor.dab_flusso_attivo') in ['on','off'] and
             states('sensor.pr205_blocco_filtri') in ['0','1'] }}
        state: >-
          {{ is_state('binary_sensor.q1_potabile','on')
             and is_state('binary_sensor.dab_flusso_attivo','off')
             and is_state('input_boolean.pr205_diag_ciclo_attivo','off')
             and is_state('sensor.pr205_blocco_filtri','0')
             and states('sensor.pr205_diag_variazione_potabile_10min') | float(999) < 2 }}
        delay_on: "00:15:00"

      - name: PR205 DIAG Calo pozzo ingiustificato
        unique_id: pr205_diag_calo_pozzo_20261025
        availability: >-
          {{ is_number(states('sensor.pr205_diag_variazione_pozzo_10min')) and
             states('binary_sensor.q1_potabile') in ['on','off'] and
             states('binary_sensor.q2_pozzo') in ['on','off'] and
             states('sensor.pr205_blocco_filtri') in ['0','1'] }}
        state: >-
          {{ is_state('binary_sensor.q1_potabile','off')
             and is_state('binary_sensor.q2_pozzo','off')
             and is_state('input_boolean.pr205_diag_ciclo_attivo','off')
             and is_state('sensor.pr205_blocco_filtri','0')
             and states('sensor.pr205_diag_variazione_pozzo_10min') | float(0) < -3 }}
        delay_on: "00:03:00"

      - name: PR205 DIAG Calo potabile ingiustificato
        unique_id: pr205_diag_calo_potabile_20261025
        availability: >-
          {{ is_number(states('sensor.pr205_diag_variazione_potabile_10min')) and
             states('binary_sensor.q1_potabile') in ['on','off'] and
             states('binary_sensor.dab_flusso_attivo') in ['on','off'] and
             states('sensor.pr205_blocco_filtri') in ['0','1'] }}
        state: >-
          {{ is_state('binary_sensor.q1_potabile','off')
             and is_state('binary_sensor.dab_flusso_attivo','off')
             and is_state('input_boolean.pr205_diag_ciclo_attivo','off')
             and is_state('sensor.pr205_blocco_filtri','0')
             and states('sensor.pr205_diag_variazione_potabile_10min') | float(0) < -3 }}
        delay_on: "00:03:00"

      - name: PR205 DIAG Dati PLC non disponibili
        unique_id: pr205_diag_plc_assente_20261025
        state: >-
          {{ states('sensor.pr205_blocco_filtri') in ['unknown','unavailable']
             or states('sensor.livello_pozzo_plc') in ['unknown','unavailable']
             or states('sensor.livello_potabile_plc') in ['unknown','unavailable'] }}
        delay_on: "00:02:00"
        delay_off: "00:00:10"

# Sensori statistici. Prima dei 10 minuti iniziali sono ancora in calibrazione.
sensor:
  - platform: statistics
    name: PR205 DIAG Variazione pozzo 10min
    unique_id: pr205_diag_variazione_pozzo_10min_20261025
    entity_id: sensor.pr205_diag_campione_pozzo
    state_characteristic: change
    max_age:
      minutes: 10
    sampling_size: 30
    precision: 1
  - platform: statistics
    name: PR205 DIAG Variazione potabile 10min
    unique_id: pr205_diag_variazione_potabile_10min_20261025
    entity_id: sensor.pr205_diag_campione_potabile
    state_characteristic: change
    max_age:
      minutes: 10
    sampling_size: 30
    precision: 1

automation:
  # Si attiva solo alla PRIMA presenza di scarico. Gli ulteriori stadi non resettano l'ora.
  - id: pr205_diag_inizio_controlavaggio_20261025
    alias: PR205 DIAG - Inizio controlavaggio multi-stadio
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.pr205_blocco_filtri
        to: '1'
    conditions:
      - condition: state
        entity_id: input_boolean.pr205_diag_ciclo_attivo
        state: 'off'
    actions:
      - variables:
          filtro: >-
            {% set m = now().hour * 60 + now().minute %}
            {% if now().weekday() in [0, 3] and 570 <= m <= 630 %}
              Filtro 2 programmato
            {% elif now().weekday() in [1, 5] and 810 <= m <= 870 %}
              Filtro 3 programmato
            {% else %}
              Filtro 4 presunto
            {% endif %}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.pr205_diag_inizio_lavaggio
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.pr205_diag_filtro_in_ciclo
        data:
          option: "{{ filtro | trim }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pr205_diag_ciclo_attivo
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ filtro | trim == 'Filtro 2 programmato' }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.pr205_diag_ultimo_filtro2
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - conditions:
              - condition: template
                value_template: "{{ filtro | trim == 'Filtro 3 programmato' }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.pr205_diag_ultimo_filtro3
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        default:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.pr205_diag_ultimo_filtro4
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # Chiusura non prima di 60 minuti E almeno 10 minuti continuativi senza scarico.
  # Consente pause tra gli stadi e identifica gli scarichi oltre il termine dell'ora.
  - id: pr205_diag_fine_controlavaggio_20261025
    alias: PR205 DIAG - Fine finestra controlavaggio
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: '/1'
      - trigger: state
        entity_id: sensor.pr205_blocco_filtri
        to: '0'
    conditions:
      - condition: state
        entity_id: input_boolean.pr205_diag_ciclo_attivo
        state: 'on'
      - condition: state
        entity_id: sensor.pr205_blocco_filtri
        state: '0'
      - condition: template
        value_template: >-
          {% set t = as_timestamp(states('input_datetime.pr205_diag_inizio_lavaggio'), 0) %}
          {{ t > 0 and (as_timestamp(now()) - t) >= 3600 }}
      - condition: template
        value_template: >-
          {{ (as_timestamp(now()) - as_timestamp(states.sensor.pr205_blocco_filtri.last_changed, as_timestamp(now()))) >= 600 }}
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.pr205_diag_durata_ultimo_lavaggio
        data:
          value: >-
            {% set a = as_timestamp(states('input_datetime.pr205_diag_inizio_lavaggio'), as_timestamp(now())) %}
            {% set b = as_timestamp(states.sensor.pr205_blocco_filtri.last_changed, as_timestamp(now())) %}
            {{ [0, ((b - a)/60)] | max | round(1) }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pr205_diag_ciclo_attivo
      - action: input_select.select_option
        target:
          entity_id: input_select.pr205_diag_filtro_in_ciclo
        data:
          option: Nessuno

  - id: pr205_diag_memoria_chiusura_q2_20261025
    alias: PR205 DIAG - Memoria chiusura Q2 per Q3
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.q2_pozzo
        from: 'on'
        to: 'off'
    conditions:
      - condition: state
        entity_id: binary_sensor.q3_ricircolo
        state: 'on'
      - condition: state
        entity_id: switch.plc_ha_manuale
        state: 'off'
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.pr205_diag_ultima_chiusura_q2
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          
                    
homeassistant:
  customize:
    binary_sensor.pr205_diag_scarico_oltre_un_ora:
      descrizione: >-
        Scarico dei filtri per oltre 60 minuti dal primo stadio.
        Le pause tra gli stadi non azzerano il conteggio.
      quando_si_accende: >-
        Il sensore scarico vale 1 dopo 60 minuti
        dall'inizio del ciclo.
      cosa_controllare: >-
        Controllare la valvola del filtro e il ritorno
        in posizione normale.

    binary_sensor.pr205_diag_filtro_2_non_partito:
      descrizione: >-
        Mancato controlavaggio del filtro 2,
        previsto lunedì e giovedì alle 10:00.
      quando_si_accende: >-
        Nessun ciclo riconosciuto entro le 10:40
        nei giorni programmati.
      cosa_controllare: >-
        Verificare programmazione e orologio del filtro.
        L'identificazione dipende dall'orario.

    binary_sensor.pr205_diag_filtro_3_non_partito:
      descrizione: >-
        Mancato controlavaggio del filtro 3,
        previsto martedì e sabato alle 14:00.
      quando_si_accende: >-
        Nessun ciclo riconosciuto entro le 14:40
        nei giorni programmati.
      cosa_controllare: >-
        Verificare programmazione e orologio del filtro.
        L'identificazione dipende dall'orario.

    binary_sensor.pr205_diag_q2_senza_ricircolo_q3:
      descrizione: >-
        La valvola pozzo Q2 è comandata aperta,
        ma manca il comando della pompa Q3.
      quando_si_accende: >-
        Q2 ON e Q3 OFF per almeno 1 minuto,
        con manuale HA disattivato.
      cosa_controllare: >-
        Verificare Q3 e i consensi del PLC.
        Lo stato Q3 è un comando, non una conferma di marcia.

    binary_sensor.pr205_diag_ricircolo_non_mantenuto:
      descrizione: >-
        Q3 si spegne troppo presto dopo la chiusura di Q2.
      quando_si_accende: >-
        Q3 OFF entro 4 ore dalla chiusura Q2,
        tra le 11:00 e le 17:00, fuori manuale HA.
      cosa_controllare: >-
        Controllare temporizzatore e condizioni
        del ricircolo nel PLC.

    binary_sensor.pr205_diag_q2_senza_cloratore_q4:
      descrizione: >-
        Il PLC apre Q2 ma non abilita il cloratore Q4.
      quando_si_accende: >-
        Q2 ON e Q4 OFF per oltre 1 minuto,
        fuori manuale HA.
      cosa_controllare: >-
        Controllare la logica Q4.
        La spia non certifica l'effettivo dosaggio.

    binary_sensor.pr205_diag_cloratore_q4_senza_q2:
      descrizione: >-
        Il PLC abilita il cloratore Q4 con Q2 chiusa.
      quando_si_accende: >-
        Q4 ON e Q2 OFF per oltre 1 minuto,
        fuori manuale HA.
      cosa_controllare: >-
        Verificare in sicurezza la clorazione
        e le condizioni di abilitazione Q4.

    binary_sensor.pr205_diag_pozzo_non_sale_con_q2:
      descrizione: >-
        Il pozzo non mostra il riempimento previsto
        nonostante il comando di apertura Q2.
      quando_si_accende: >-
        Q2 ON, Q1 OFF, nessun controlavaggio,
        aumento inferiore a 2 cm in 10 minuti,
        condizione persistente per 15 minuti.
      cosa_controllare: >-
        Controllare disponibilità acqua, Q2 e sonda.
        Soglia iniziale da calibrare.

    binary_sensor.pr205_diag_potabile_non_sale_con_q1:
      descrizione: >-
        La potabile non mostra il riempimento previsto
        nonostante il comando di apertura Q1.
      quando_si_accende: >-
        Q1 ON, DAB senza flusso, nessun controlavaggio,
        aumento inferiore a 2 cm in 10 minuti,
        condizione persistente per 15 minuti.
      cosa_controllare: >-
        Controllare Q1, tubazioni, disponibilità
        acqua nel pozzo e sonda.

    binary_sensor.pr205_diag_calo_pozzo_ingiustificato:
      descrizione: >-
        Il livello del pozzo diminuisce senza
        una causa normale riconosciuta.
      quando_si_accende: >-
        Q1 e Q2 OFF, nessun controlavaggio,
        calo superiore a 3 cm in 10 minuti,
        persistente per 3 minuti.
      cosa_controllare: >-
        Verificare trafilamenti, scarichi non
        rilevati e precisione della sonda.

    binary_sensor.pr205_diag_calo_potabile_ingiustificato:
      descrizione: >-
        Il livello potabile diminuisce senza
        consumo DAB o scarico filtri riconosciuto.
      quando_si_accende: >-
        Q1 OFF, DAB senza flusso, nessun controlavaggio,
        calo superiore a 3 cm in 10 minuti,
        persistente per 3 minuti.
      cosa_controllare: >-
        Controllare perdite, prelievi non
        rilevati e sonda del livello.

    binary_sensor.pr205_diag_dati_plc_non_disponibili:
      descrizione: >-
        Il PLC non fornisce dati validi
        necessari alla diagnostica.
      quando_si_accende: >-
        Il sensore scarico filtri oppure
        un livello è unknown/unavailable
        per più di 2 minuti.
      cosa_controllare: >-
        Verificare alimentazione PR205,
        rete e comunicazione Modbus TCP.
