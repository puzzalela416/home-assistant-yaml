id: '1791245855834'
alias: finestre aperte
description: ''
triggers:
- trigger: state
  entity_id:
  - binary_sensor.door_and_window_sensor_bd83_contact_sensor_bd83
  - binary_sensor.door_and_window_sensor_e2ec_contact_sensor_e2ec_2
  - binary_sensor.door_and_window_sensor_8371_contact_sensor_8371_2
  - binary_sensor.door_and_window_sensor_f81b_contact_sensor_f81b
  - binary_sensor.door_and_window_sensor_8343_contact_sensor_8343
  - binary_sensor.door_and_window_sensor_146f_contact_sensor_146f_2
  - binary_sensor.door_and_window_sensor_f92e_contact_sensor_f92e
  - binary_sensor.door_and_window_sensor_b21b_contact_sensor_b21b
  - binary_sensor.door_and_window_sensor_e37a_contact_sensor_e37a
  - binary_sensor.door_and_window_sensor_2602_contact_sensor_2602
  to:
  - 'on'
conditions:
- condition: alarm_control_panel.is_armed
  target:
    entity_id:
    - alarm_control_panel.allarme_casa
    - alarm_control_panel.aqara_hub_09ab_security_system_2
  options:
    for: 00:00:00
    behavior: any
actions:
- repeat:
    count: 2
    sequence:
    - action: light.toggle
      metadata: {}
      target:
        entity_id: light.1000ee1aa7_color_rgb
      data:
        rgb_color:
        - 211
        - 69
        - 9
        transition: 0
        brightness_pct: 72
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.1000ee1aa7_color_rgb
      data: {}
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.1000ee1aa7_color_rgb
      data:
        rgb_color:
        - 17
        - 14
        - 175
        brightness_pct: 51
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
    - action: light.turn_off
      metadata: {}
      target:
        entity_id: light.1000ee1aa7_color_rgb
      data: {}
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
mode: single
